    <ellipse cx="56" cy="40" rx="3" ry="2.2" fill="#2E7D32"/>
    <!-- row3: dots / sprig / rock / dot -->
    <circle cx="9" cy="56" r="1.8" fill="#2E7D32"/>
    <path d="M25 57 l1 -6 l1 6z" fill="#1B5E20"/>
    <circle cx="42" cy="56" r="2.4" fill="#1B5E20"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="elementsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <rect x="1" y="1" width="62" height="62" rx="4" fill="url(#elementsBg)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <g stroke="#2E7D32" stroke-width="1" stroke-opacity=".6">
      <line x1="17" y1="2" x2="17" y2="62"/>
      <line x1="33" y1="2" x2="33" y2="62"/>
      <line x1="48" y1="2" x2="48" y2="62"/>
      <line x1="2" y1="17" x2="62" y2="17"/>
      <line x1="2" y1="33" x2="62" y2="33"/>
      <line x1="2" y1="48" x2="62" y2="48"/>
    </g>
    <!-- row0: dots / tuft / line / circle -->
    <circle cx="9" cy="9" r="2" fill="#2E7D32"/>
    <path d="M25 13 l1 -5 l1 5z" fill="#1B5E20"/>
    <rect x="38" y="6" width="8" height="8" rx="1" fill="#2E7D32"/>
    <circle cx="56" cy="9" r="2.5" fill="#1B5E20"/>
    <!-- row1: triangle / rock / bush / dot -->
    <path d="M9 18 l3 9 l-6 0z" fill="#2E7D32"/>
    <path d="M25 21 l3 6 l-6 0z" fill="#1B5E20"/>
    <circle cx="42" cy="25" r="3" fill="#2E7D32"/>
    <circle cx="56" cy="25" r="2" fill="#1B5E20"/>
    <!-- row2: log / hole / sprig / stone -->
    <rect x="4" y="38" width="11" height="4" rx="2" fill="#1B5E20"/>
    <circle cx="25" cy="40" r="2.5" fill="#1B5E20"/>

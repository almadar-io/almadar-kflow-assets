    <linearGradient id="bevel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1B5E20" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <g id="base-shape">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tarmac-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="6" ry="6" fill="url(#tarmac-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- White & Yellow Asphalt Court/Track Paint Lines -->
    <line x1="4" y1="32" x2="60" y2="32" stroke="#FDE047" stroke-width="3" stroke-dasharray="8 6" opacity="0.95"/>
    <line x1="12" y1="4" x2="12" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
    <line x1="52" y1="4" x2="52" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>

    <!-- Fine Asphalt Grain Texture -->
    <circle cx="20" cy="18" r="1" fill="#94A3B8" opacity="0.5"/>
    <circle cx="36" cy="14" r="1.2" fill="#64748B" opacity="0.6"/>
    <circle cx="44" cy="22" r="1" fill="#94A3B8" opacity="0.5"/>
    <circle cx="24" cy="46" r="1.2" fill="#94A3B8" opacity="0.5"/>
    <circle cx="40" cy="50" r="1" fill="#64748B" opacity="0.6"/>
  </g>

  <g id="highlights">
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
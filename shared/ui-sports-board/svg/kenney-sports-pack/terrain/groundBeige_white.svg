<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="beige-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="6" ry="6" fill="url(#beige-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- White / Yellow Sports Court Section -->
    <rect x="10" y="10" width="44" height="44" rx="4" ry="4" fill="url(#white-grad)" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Court Boundary Lines -->
    <rect x="14" y="14" width="36" height="36" rx="2" ry="2" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <!-- Center Line & Circle -->
    <line x1="14" y1="32" x2="50" y2="32" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <circle cx="32" cy="32" r="7" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
    <circle cx="32" cy="32" r="1.5" fill="#FFFFFF"/>
  </g>

  <g id="highlights">
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="12" y1="12" x2="52" y2="12" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
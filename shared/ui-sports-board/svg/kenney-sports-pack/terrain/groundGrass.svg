<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="40%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="dirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <!-- Main block container -->
    <rect x="4" y="4" width="56" height="56" rx="6" ry="6" fill="url(#dirt-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Grass top crust -->
    <path d="M 4 10 Q 14 6 24 10 T 44 8 T 60 10 L 60 28 Q 46 32 32 28 Q 18 32 4 28 Z" fill="url(#grass-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- Dirt pebbles/texture -->
    <circle cx="16" cy="40" r="2.5" fill="#3E2723" opacity="0.6"/>
    <circle cx="28" cy="48" r="3" fill="#3E2723" opacity="0.6"/>
    <circle cx="44" cy="38" r="2" fill="#3E2723" opacity="0.6"/>
    <circle cx="50" cy="48" r="2.5" fill="#3E2723" opacity="0.6"/>
    <circle cx="20" cy="52" r="1.5" fill="#A1887F" opacity="0.4"/>
    <circle cx="38" cy="44" r="1.5" fill="#A1887F" opacity="0.4"/>
    
    <!-- Organic Grass Tufts & Blades -->
    <path d="M 12 10 L 10 3 L 15 9 M 22 8 L 24 2 L 27 9 M 36 7 L 35 1 L 40 7 M 50 9 L 52 3 L 54 10" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 10 3 L 11 8 M 24 2 L 25 8 M 35 1 L 37 7 M 52 3 L 51 9" fill="none" stroke="#81C784" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Grass layer bottom trim -->
    <path d="M 8 26 L 12 30 L 16 26 M 26 27 L 30 31 L 34 27 M 44 26 L 48 30 L 52 26" fill="none" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="highlights">
    <!-- Top specular highlight -->
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#81C784" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="grass-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="grass-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="6" ry="6" fill="url(#dirt-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 4 10 Q 14 6 24 10 T 44 8 T 60 10 L 60 28 Q 46 32 32 28 Q 18 32 4 28 Z" fill="#2E7D32" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- Wide alternating mown vertical lawn stripes (28px wide each) -->
    <rect x="4" y="6" width="28" height="22" fill="url(#grass-light)"/>
    <rect x="32" y="6" width="28" height="22" fill="url(#grass-dark)"/>

    <!-- Grass layer bottom shadow trim -->
    <path d="M 4 28 Q 18 32 32 28 Q 46 32 60 28 L 60 30 L 4 30 Z" fill="#1B5E20"/>

    <!-- Dirt texture accents -->
    <circle cx="18" cy="44" r="2.5" fill="#3E2723" opacity="0.6"/>
    <circle cx="44" cy="46" r="3" fill="#3E2723" opacity="0.6"/>

    <!-- Stripe separation line -->
    <line x1="32" y1="6" x2="32" y2="28" stroke="#1B5E20" stroke-width="1.5" opacity="0.5"/>
  </g>

  <g id="highlights">
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#81C784" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
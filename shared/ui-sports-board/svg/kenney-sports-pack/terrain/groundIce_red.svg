<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ice-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="red-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="6" ry="6" fill="url(#ice-base)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- Hockey Ice Rink Red Line & Faceoff Spot -->
    <rect x="8" y="26" width="48" height="12" fill="url(#red-line-grad)" opacity="0.85"/>
    <circle cx="32" cy="32" r="10" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.9"/>
    <circle cx="32" cy="32" r="3" fill="#B91C1C"/>
    
    <!-- Ice skate scratch marks texture -->
    <path d="M 12 14 L 20 18 M 40 12 L 48 15 M 14 48 L 22 52 M 42 46 L 50 50" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 16 16 L 24 12 M 38 52 L 46 48" fill="none" stroke="#BAE6FD" stroke-width="1" opacity="0.8"/>
  </g>

  <g id="highlights">
    <!-- Glare specular on ice -->
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="8" y1="12" x2="28" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
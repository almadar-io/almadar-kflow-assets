<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <radialGradient id="ball-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="8" ry="8" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- Equipment Icons Array: Ball & Cone & Trophy -->
    <!-- Soccer Ball (Left Top) -->
    <circle cx="22" cy="24" r="10" fill="url(#ball-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="22,18 25,21 24,25 20,25 19,21" fill="#1E293B"/>
    <line x1="22" y1="18" x2="22" y2="14" stroke="#1E293B" stroke-width="1"/>
    <line x1="25" y1="21" x2="29" y2="20" stroke="#1E293B" stroke-width="1"/>
    <line x1="24" y1="25" x2="27" y2="28" stroke="#1E293B" stroke-width="1"/>
    <line x1="20" y1="25" x2="17" y2="28" stroke="#1E293B" stroke-width="1"/>
    <line x1="19" y1="21" x2="15" y2="20" stroke="#1E293B" stroke-width="1"/>

    <!-- Sports Marker Cone (Right Top) -->
    <path d="M 46 14 L 38 30 L 54 30 Z" fill="#F97316" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="36" y="30" width="20" height="4" rx="1" fill="#EA580C" stroke="#1E293B" stroke-width="1"/>
    <path d="M 41 24 L 51 24" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Whistle & Stop Watch (Bottom) -->
    <path d="M 20 44 C 20 40 24 38 28 38 L 36 38 L 36 44 L 40 44 L 40 48 L 36 48 L 36 50 C 36 53 32 54 28 54 C 24 54 20 52 20 48 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="26" cy="46" r="3" fill="#1E293B"/>
  </g>

  <g id="highlights">
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="equipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <rect x="1" y="1" width="62" height="62" rx="4" fill="url(#equipBg)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <g stroke="#2E7D32" stroke-width="1" stroke-opacity=".55">
      <line x1="17" y1="2" x2="17" y2="62"/>
      <line x1="33" y1="2" x2="33" y2="62"/>
      <line x1="48" y1="2" x2="48" y2="62"/>
      <line x1="2" y1="17" x2="62" y2="17"/>
      <line x1="2" y1="33" x2="62" y2="33"/>
      <line x1="2" y1="48" x2="62" y2="48"/>
    </g>
    <!-- balls -->
    <circle cx="9" cy="9" r="4.5" fill="#1B5E20" stroke="#1E293B" stroke-width="1"/>
    <circle cx="25" cy="9" r="4.5" fill="#2E7D32" stroke="#1E293B" stroke-width="1"/>
    <circle cx="42" cy="9" r="4.5" fill="#1B5E20" stroke="#1E293B" stroke-width="1"/>
    <circle cx="56" cy="9" r="4.5" fill="#2E7D32" stroke="#1E293B" stroke-width="1"/>
    <!-- cones / flags -->
    <path d="M9 25 l-3 7 l6 0z" fill="#1B5E20" stroke="#1E293B" stroke-width="1"/>
    <path d="M25 25 l-3 7 l6 0z" fill="#2E7D32" stroke="#1E293B" stroke-width="1"/>
    <path d="M42 19 l0 10 l-5 0z" fill="#1B5E20" stroke="#1E293B" stroke-width="1"/>
    <path d="M56 19 l0 10 l-5 0z" fill="#2E7D32" stroke="#1E293B" stroke-width="1"/>
    <!-- posts / nets -->
    <rect x="6" y="37" width="6" height="10" fill="#1B5E20" stroke="#1E293B" stroke-width="1"/>
    <rect x="22" y="37" width="6" height="10" fill="#2E7D32" stroke="#1E293B" stroke-width="1"/>
    <g stroke="#1B5E20" stroke-width=".8" fill="none"><rect x="37" y="37" width="10" height="10"/><line x1="37" y1="42" x2="47" y2="42"/><line x1="42" y1="37" x2="42" y2="47"/></g>
    <g stroke="#2E7D32" stroke-width=".8" fill="none"><rect x="51" y="37" width="10" height="10"/><line x1="51" y1="42" x2="61" y2="42"/><line x1="56" y1="37" x2="56" y2="47"/></g>
    <!-- bats / rackets -->
    <rect x="6" y="53" width="3" height="8" rx="1.5" fill="#1B5E20"/>
    <rect x="22" y="53" width="3" height="8" rx="1.5" fill="#2E7D32"/>
    <circle cx="42" cy="57" r="4" fill="none" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="56" cy="57" r="4" fill="none" stroke="#2E7D32" stroke-width="2"/>
  </g>
  <g id="highlights">
    <circle cx="7" cy="7" r="1.2" fill="#81C784"/>
    <circle cx="40" cy="7" r="1.2" fill="#81C784"/>
    <path d="M6 6 Q32 3 58 6" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
</svg>

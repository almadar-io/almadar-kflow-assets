<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="helmet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="skin-tone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="8" ry="8" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g id="surface-details">
    <!-- Character with Helmet & Baseball Bat / Hockey Stick -->
    <g id="equipped-character" transform="translate(0, 2)">
      <!-- Ground Shadow -->
      <ellipse cx="32" cy="50" rx="14" ry="4" fill="#1B5E20" opacity="0.6"/>

      <!-- Player Body / Uniform -->
      <path d="M 22 28 L 42 28 L 40 46 L 24 46 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
      
      <!-- Head & Skin -->
      <circle cx="32" cy="20" r="7" fill="url(#skin-tone)" stroke="#1E293B" stroke-width="1.5"/>

      <!-- Sports Helmet with Visor -->
      <path d="M 23 20 C 23 12 41 12 41 20 L 42 22 L 22 22 Z" fill="url(#helmet-grad)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 24 22 C 28 20 36 20 40 22 L 40 24 L 24 24 Z" fill="#94A3B8" opacity="0.8"/>

      <!-- Equipment: Sports Stick / Bat held across -->
      <path d="M 12 46 L 48 18" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 12 46 L 48 18" stroke="#FEF08A" stroke-width="1" stroke-linecap="round"/>
      <path d="M 46 16 L 52 14 L 50 20 Z" fill="#D97706" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- Gloves -->
      <circle cx="22" cy="38" r="3" fill="#1E293B"/>
      <circle cx="36" cy="27" r="3" fill="#1E293B"/>
    </g>
  </g>

  <g id="highlights">
    <path d="M 6 10 A 4 4 0 0 1 10 6 L 54 6 A 4 4 0 0 1 58 10" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
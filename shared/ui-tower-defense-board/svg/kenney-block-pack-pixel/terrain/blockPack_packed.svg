<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- pixel-art stepped block silhouette -->
    <rect x="16" y="8" width="32" height="8" fill="#81C784"/>
    <rect x="12" y="16" width="40" height="8" fill="#81C784"/>
    <rect x="8" y="24" width="48" height="32" fill="url(#baseG)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <!-- pixel brick pixel grid -->
    <g fill="#2E7D32">
      <rect x="8" y="32" width="16" height="8"/>
      <rect x="40" y="32" width="16" height="8"/>
      <rect x="24" y="40" width="16" height="8"/>
      <rect x="8" y="48" width="16" height="8"/>
      <rect x="40" y="48" width="16" height="8"/>
    </g>
    <g fill="#1B5E20">
      <rect x="8" y="40" width="16" height="8"/>
      <rect x="40" y="40" width="16" height="8"/>
    </g>
  </g>
  <g id="highlights">
    <line x1="12" y1="10" x2="44" y2="10" stroke="#81C784" stroke-width="2"/>
    <line x1="10" y1="26" x2="54" y2="26" stroke="#81C784" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>

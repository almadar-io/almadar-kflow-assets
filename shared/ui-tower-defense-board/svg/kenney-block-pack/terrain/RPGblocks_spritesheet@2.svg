<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
    <pattern id="brk" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="url(#baseG)"/>
      <path d="M0,6 H12 M6,0 V6 M0,12 H6" stroke="#2E7D32" stroke-width="0.8" fill="none"/>
    </pattern>
  </defs>
  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" rx="5" fill="url(#brk)" stroke="#1E293B" stroke-width="2"/>
    <rect x="8" y="8" width="48" height="48" rx="3" fill="none" stroke="#2E7D32" stroke-width="1"/>
  </g>
  <g id="surface-details">
    <!-- high-detail @2 variant: finer mortar + cracks + rivets -->
    <g stroke="#1B5E20" stroke-width="0.5" fill="none" opacity="0.7">
      <path d="M14,20 q4,3 8,1 t8,2"/>
      <path d="M36,40 q4,3 8,1"/>
    </g>
    <g fill="#2E7D32">
      <circle cx="9" cy="9" r="1.2"/>
      <circle cx="55" cy="9" r="1.2"/>
      <circle cx="9" cy="55" r="1.2"/>
      <circle cx="55" cy="55" r="1.2"/>
    </g>
  </g>
  <g id="highlights">
    <path d="M8,9 Q32,5 56,9" fill="none" stroke="#81C784" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M8,9 L8,56" fill="none" stroke="#81C784" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" fill="url(#baseG)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <!-- scattered ground texture: pebbles + tufts -->
    <g fill="#2E7D32" opacity="0.7">
      <circle cx="16" cy="20" r="2"/>
      <circle cx="44" cy="16" r="1.6"/>
      <circle cx="28" cy="40" r="2.2"/>
      <circle cx="50" cy="44" r="1.8"/>
      <circle cx="12" cy="48" r="1.6"/>
    </g>
    <g stroke="#1B5E20" stroke-width="0.9" stroke-linecap="round" opacity="0.8">
      <path d="M22,30 l-1,-3 M22,30 l0,-3 M22,30 l1,-3" fill="none"/>
      <path d="M38,52 l-1,-3 M38,52 l0,-3 M38,52 l1,-3" fill="none"/>
      <path d="M48,28 l-1,-3 M48,28 l0,-3 M48,28 l1,-3" fill="none"/>
    </g>
  </g>
  <g id="highlights">
    <path d="M6,6 L58,6" stroke="#81C784" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M6,6 L6,58" stroke="#81C784" stroke-width="1.2" opacity="0.5"/>

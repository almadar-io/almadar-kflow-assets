<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- RTS medieval terrain tile -->
    <rect x="4" y="4" width="56" height="56" fill="url(#baseG)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <!-- a keep/fort mark, terrain detail, footpath -->
    <g fill="#2E7D32" opacity="0.6">
      <circle cx="14" cy="18" r="1.8"/>
      <circle cx="48" cy="20" r="1.6"/>
      <circle cx="20" cy="46" r="2"/>
      <circle cx="50" cy="50" r="1.8"/>
      <circle cx="34" cy="34" r="1.4"/>
    </g>
    <!-- castle keep silhouette -->
    <g fill="#1B5E20" stroke="#1E293B" stroke-width="0.6">
      <rect x="28" y="22" width="10" height="10"/>
      <rect x="27" y="20" width="2" height="3"/>
      <rect x="32" y="20" width="2" height="3"/>
      <rect x="37" y="20" width="2" height="3"/>
    </g>
    <path d="M6,52 Q24,44 33,33 Q44,24 58,30" fill="none" stroke="#1B5E20" stroke-width="1.4" stroke-dasharray="2 2"/>
    <g stroke="#1B5E20" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
      <path d="M12,34 l-1,-3 M12,34 l0,-3 M12,34 l1,-3" fill="none"/>
      <path d="M44,44 l-1,-3 M44,44 l0,-3 M44,44 l1,-3" fill="none"/>
    </g>
  </g>
  <g id="highlights">
    <path d="M6,6 L58,6" stroke="#81C784" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M6,6 L6,58" stroke="#81C784" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>

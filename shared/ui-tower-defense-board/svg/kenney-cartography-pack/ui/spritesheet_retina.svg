    <rect x="4" y="4" width="56" height="56" rx="3" fill="url(#baseG)" stroke="#1E293B" stroke-width="2"/>
    <rect x="8" y="8" width="48" height="48" rx="2" fill="none" stroke="#2E7D32" stroke-width="1"/>
    <rect x="11" y="11" width="42" height="42" fill="none" stroke="#2E7D32" stroke-width="0.5" opacity="0.6"/>
  </g>
  <g id="surface-details">

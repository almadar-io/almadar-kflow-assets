    </g>
    <g stroke="#2E7D32" stroke-width="0.4" opacity="0.3">
      <line x1="8" y1="20" x2="56" y2="20"/>
      <line x1="8" y1="32" x2="56" y2="32"/>
      <line x1="20" y1="8" x2="20" y2="56"/>
      <line x1="44" y1="8" x2="44" y2="56"/>
    </g>
    <path d="M10,32 Q30,18 54,38" fill="none" stroke="#1B5E20" stroke-width="1.6" stroke-dasharray="3 2"/>
    <path d="M40,16 a2.4,2.4 0 1,0 4.8,0 a2.4,2.4 0 1,0 -4.8,0 M42.4,18.4 L42.4,24" fill="#1B5E20" stroke="#1E293B" stroke-width="0.6"/>
    <path d="M22,40 a2.4,2.4 0 1,0 4.8,0 a2.4,2.4 0 1,0 -4.8,0 M24.4,42.4 L24.4,48" fill="#1B5E20" stroke="#1E293B" stroke-width="0.6"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- cartography framed map panel -->
    <rect x="6" y="6" width="52" height="52" rx="4" fill="url(#baseG)" stroke="#1E293B" stroke-width="2"/>
    <rect x="10" y="10" width="44" height="44" rx="2" fill="none" stroke="#2E7D32" stroke-width="1.2"/>
  </g>
  <g id="surface-details">
    <!-- contour lines + a road + a marker pin -->
    <g stroke="#2E7D32" stroke-width="0.8" fill="none" opacity="0.8">
      <path d="M14,40 q8,-6 16,0 t16,0"/>
      <path d="M14,46 q8,-4 16,0 t16,0"/>
      <path d="M18,20 q6,4 12,0 t14,2"/>
    </g>
    <path d="M12,30 Q30,18 52,34" fill="none" stroke="#1B5E20" stroke-width="1.6" stroke-dasharray="3 2"/>
    <path d="M42,18 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 M45,21 L45,28" fill="#1B5E20" stroke="#1E293B" stroke-width="0.8"/>
  </g>
  <g id="highlights">
    <path d="M10,8 Q32,5 54,8" fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="10" cy="10" r="1.2" fill="#81C784"/>
    <circle cx="54" cy="10" r="1.2" fill="#81C784"/>
  </g>
</svg>

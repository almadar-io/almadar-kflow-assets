<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#FDE047"/>
    </linearGradient>
    <clipPath id="leftClip"><polygon points="6,18 32,32 32,58 6,44"/></clipPath>
    <clipPath id="rightClip"><polygon points="32,32 58,18 58,44 32,58"/></clipPath>
    <clipPath id="topClip"><polygon points="32,4 58,18 32,32 6,18"/></clipPath>
  </defs>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="#EAB308" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <g clip-path="url(#leftClip)" stroke="#CA8A04" stroke-width="0.7" fill="none" opacity="0.7">
      <path d="M6,30 q14,2 26,2"/>
      <path d="M6,40 q14,2 26,2"/>
      <path d="M6,50 q14,2 26,2"/>
    </g>
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#CA8A04" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <g clip-path="url(#rightClip)" stroke="#92700c" stroke-width="0.7" fill="none" opacity="0.6">
      <path d="M32,38 q14,2 26,2"/>
      <path d="M32,48 q14,2 26,2"/>
    </g>
  </g>
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="url(#topG)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- wind-rippled dune crests across the sand top -->
    <g clip-path="url(#topClip)" stroke="#CA8A04" stroke-width="0.7" fill="none" opacity="0.7">
      <path d="M8,16 q12,3 24,0 t24,0"/>
      <path d="M8,20 q12,3 24,0 t24,0"/>
      <path d="M8,24 q12,3 24,0 t24,0"/>
      <path d="M8,28 q12,3 24,0 t24,0"/>
    </g>
  </g>
  <g id="face-highlights">
    <line x1="32" y1="4" x2="58" y2="18" stroke="#FEF08A" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
    <line x1="32" y1="4" x2="6" y2="18" stroke="#FEF08A" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>

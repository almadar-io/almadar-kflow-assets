<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <clipPath id="leftClip"><polygon points="6,18 32,32 32,58 6,44"/></clipPath>
    <clipPath id="rightClip"><polygon points="32,32 58,18 58,44 32,58"/></clipPath>
    <clipPath id="topClip"><polygon points="32,4 58,18 32,32 6,18"/></clipPath>
  </defs>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="#64748B" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- chiselled masonry mortar grid on the left wall -->
    <g clip-path="url(#leftClip)" stroke="#334155" stroke-width="0.9" fill="none">
      <line x1="0" y1="30" x2="40" y2="30"/>
      <line x1="0" y1="42" x2="40" y2="42"/>
      <line x1="0" y1="54" x2="40" y2="54"/>
      <line x1="12,16" x2="12,60"/>
      <line x1="24,16" x2="24,60"/>
      <line x1="18,24" x2="18,60" opacity="0.6"/>
      <line x1="6,24" x2="6,60" opacity="0.6"/>
    </g>
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#334155" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <g clip-path="url(#rightClip)" stroke="#1e2a3a" stroke-width="0.9" fill="none">
      <line x1="28" y1="30" x2="64" y2="30"/>
      <line x1="28" y1="42" x2="64" y2="42"/>
      <line x1="28" y1="54" x2="64" y2="54"/>
      <line x1="40,16" x2="40,60"/>
      <line x1="52,16" x2="52,60"/>
      <line x1="46,24" x2="46,60" opacity="0.6"/>
    </g>
  </g>
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="url(#topG)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- bevelled stone cap: mortar cross + chamfer -->
    <g clip-path="url(#topClip)" stroke="#334155" stroke-width="0.9" fill="none" opacity="0.8">
      <line x1="32,4" x2="32,32"/>
      <line x1="6,18" x2="58,18"/>
      <line x1="19,11" x2="45,25"/>
      <line x1="45,11" x2="19,25"/>
    </g>
    <polygon points="32,9 53,18.5 32,28 11,18.5" fill="none" stroke="#CBD5E1" stroke-width="0.7" opacity="0.7"/>
  </g>
  <g id="face-highlights">
    <line x1="32" y1="4" x2="58" y2="18" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
    <line x1="32" y1="4" x2="6" y2="18" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>

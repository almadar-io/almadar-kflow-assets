<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
    <clipPath id="leftClip"><polygon points="6,18 32,32 32,58 6,44"/></clipPath>
    <clipPath id="rightClip"><polygon points="32,32 58,18 58,44 32,58"/></clipPath>
    <clipPath id="topClip"><polygon points="32,4 58,18 32,32 6,18"/></clipPath>
  </defs>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="#2E7D32" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- concrete form-tie joints and a hairline crack -->
    <g clip-path="url(#leftClip)" stroke="#1B5E20" stroke-width="0.6" opacity="0.5">
      <line x1="0" y1="34" x2="40" y2="34"/>
      <line x1="0" y1="48" x2="40" y2="48"/>
      <line x1="16,16" x2="16,60"/>
    </g>
    <g clip-path="url(#leftClip)" stroke="#1B5E20" stroke-width="0.4" fill="none" opacity="0.6">
      <path d="M10,40 q4,3 8,1 t8,2"/>
    </g>
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#1B5E20" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <g clip-path="url(#rightClip)" stroke="#0d3b14" stroke-width="0.6" opacity="0.5">
      <line x1="28" y1="34" x2="64" y2="34"/>
      <line x1="28" y1="48" x2="64" y2="48"/>
      <line x1="48,16" x2="48,60"/>
    </g>
  </g>
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="url(#topG)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <!-- trowel sweep + control joint on the concrete cap -->
    <g clip-path="url(#topClip)" stroke="#1B5E20" stroke-width="0.5" opacity="0.4" fill="none">
      <path d="M10,16 q12,4 26,2 t16,2"/>
      <path d="M12,20 q14,-2 28,1"/>
      <line x1="32,4" x2="32,32"/>
    </g>
  </g>
  <g id="face-highlights">
    <line x1="32" y1="4" x2="58" y2="18" stroke="#81C784" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
    <line x1="32" y1="4" x2="6" y2="18" stroke="#81C784" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>

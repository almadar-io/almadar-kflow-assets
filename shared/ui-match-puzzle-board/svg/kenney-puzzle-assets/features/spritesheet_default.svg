<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="def-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="50%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </linearGradient>
    <filter id="def-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: 2x2 Feature Spritesheet Grid -->
  <g id="base-shape" filter="url(#def-shadow)">
    <!-- Top-Left Circle Block -->
    <rect x="4" y="4" width="26" height="26" rx="6" ry="6" fill="url(#def-grad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Top-Right Star Block -->
    <rect x="34" y="4" width="26" height="26" rx="6" ry="6" fill="url(#def-grad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Bottom-Left Diamond Block -->
    <rect x="4" y="34" width="26" height="26" rx="6" ry="6" fill="url(#def-grad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Bottom-Right Triangle Block -->
    <rect x="34" y="34" width="26" height="26" rx="6" ry="6" fill="url(#def-grad)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- 2. Surface Details: White Gem Shape Icons -->
  <g id="surface-details">
    <!-- Circle Icon -->
    <circle cx="17" cy="17" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="15.5" cy="15.5" r="2" fill="var(--color-asset-highlight, #81C784)"/>

    <!-- Star Icon -->
    <path d="M 47 10 L 49 14.5 L 54 15 L 50.2 18.2 L 51.5 23 L 47 20.5 L 42.5 23 L 43.8 18.2 L 40 15 L 45 14.5 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Diamond Icon -->
    <path d="M 17 38 L 24 47 L 17 56 L 10 47 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 17 41 L 21 47 L 17 53 L 13 47 Z" fill="var(--color-asset-primary, #4CAF50)"/>

    <!-- Triangle Icon -->
    <path d="M 47 38 L 55 52 L 39 52 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
  </g>

  <!-- 3. Highlights: Top Left Specular Curved Glints -->
  <g id="highlights">
    <path d="M 8 6 L 24 6 C 26 6, 26 7, 24 7 L 10 7 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 38 6 L 54 6 C 56 6, 56 7, 54 7 L 40 7 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 8 36 L 24 36 C 26 36, 26 37, 24 37 L 10 37 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 38 36 L 54 36 C 56 36, 56 37, 54 37 L 40 37 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
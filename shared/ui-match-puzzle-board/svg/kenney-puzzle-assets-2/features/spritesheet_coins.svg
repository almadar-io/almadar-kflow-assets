<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="45%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </linearGradient>
    <linearGradient id="coin-edge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Coin Rotation Animation Sequence (4 States) -->
  <g id="base-shape" filter="url(#coin-shadow)">
    <!-- Top-Left: Full Frontal Coin -->
    <ellipse cx="18" cy="18" rx="14" ry="14" fill="url(#coin-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Top-Right: 3/4 Angled Coin -->
    <ellipse cx="46" cy="18" rx="10" ry="14" fill="url(#coin-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Bottom-Left: 1/4 Slim Edge Coin -->
    <ellipse cx="18" cy="46" rx="5" ry="14" fill="url(#coin-edge-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Bottom-Right: Side Profile Coin -->
    <ellipse cx="46" cy="46" rx="8" ry="14" fill="url(#coin-grad)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- 2. Surface Details: Inner Rims, Insets & Star Symbols -->
  <g id="surface-details">
    <!-- Top-Left Full Coin Inset Rim & Star -->
    <ellipse cx="18" cy="18" rx="10" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <path d="M 18 12 L 19.5 16 L 23.5 16 L 20.3 18.3 L 21.5 22.5 L 18 19.8 L 14.5 22.5 L 15.7 18.3 L 12.5 16 L 16.5 16 Z" fill="#FFFFFF"/>

    <!-- Top-Right 3/4 Coin Inset Rim & Star -->
    <ellipse cx="46" cy="18" rx="7" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
    <path d="M 46 13 L 47 16 L 50 16 L 47.8 18 L 48.7 21 L 46 19 L 43.3 21 L 44.2 18 L 42 16 L 45 16 Z" fill="#FFFFFF"/>

    <!-- Bottom-Left Slim Edge Coin Ribbing -->
    <line x1="18" y1="34" x2="18" y2="58" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

    <!-- Bottom-Right Coin Details -->
    <ellipse cx="46" cy="46" rx="5" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 3. Highlights: Bright Vertical Glints & Specular Streaks -->
  <g id="highlights">
    <!-- Full Coin Glint Curve -->
    <path d="M 8 18 C 8 11, 13 6, 20 6 C 14 7, 10 11, 10 18 Z" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="12" cy="12" r="1.5" fill="#FFFFFF"/>

    <!-- Angled Coin Glint Streaks -->
    <path d="M 39 12 C 43 7, 49 7, 51 10 C 47 9, 42 10, 40 14 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 40 40 C 44 35, 49 35, 51 38 C 47 37, 42 38, 40 42 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ball-main-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="65%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </radialGradient>
    <radialGradient id="ball-sub-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="60%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <filter id="ball-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Spheres & Outer Shadows -->
  <g id="base-shape" filter="url(#ball-shadow)">
    <!-- Main Center Ball -->
    <circle cx="32" cy="32" r="22" fill="url(#ball-main-grad)" stroke="#1E293B" stroke-width="2.5"/>
    
    <!-- Spritesheet Corner Orbs (Mini Variants) -->
    <circle cx="12" cy="12" r="8" fill="url(#ball-sub-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="52" cy="12" r="8" fill="url(#ball-sub-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="12" cy="52" r="8" fill="url(#ball-sub-grad)" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="52" cy="52" r="8" fill="url(#ball-sub-grad)" stroke="#1E293B" stroke-width="1.5"/>
  </g>

  <!-- 2. Surface Details: Seams, Inner Glows & Contour Ridges -->
  <g id="surface-details">
    <!-- Main Ball Arc Seams / Tennis Ball Style Curve -->
    <path d="M 18 18 C 26 28, 38 28, 46 18" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="1.8" opacity="0.6"/>
    <path d="M 18 46 C 26 36, 38 36, 46 46" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="1.8" opacity="0.6"/>

    <!-- Corner Balls Surface Lines -->
    <path d="M 7 12 C 12 16, 17 12, 17 12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <path d="M 47 12 C 52 16, 57 12, 57 12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <path d="M 7 52 C 12 56, 17 52, 17 52" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <path d="M 47 52 C 52 56, 57 52, 57 52" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 3. Highlights: Specular Reflection Ellipses & Curved Spotlights -->
  <g id="highlights">
    <!-- Main Ball Glassy Spot Highlight -->
    <ellipse cx="23" cy="20" rx="7" ry="4.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 23 20)"/>
    <circle cx="27" cy="25" r="2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Corner Balls Specular Glints -->
    <circle cx="9" cy="9" r="2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="49" cy="9" r="2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="9" cy="49" r="2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="49" cy="49" r="2" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
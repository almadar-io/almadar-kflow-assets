  </defs>
  <g id="base-shape">
    <rect x="2" y="2" width="60" height="60" rx="4" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
    <rect x="3" y="3" width="29" height="29" fill="url(#dots)"/>
    <rect x="32" y="3" width="29" height="29" fill="url(#dots)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="backtile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: 2x2 Backtile Grid -->
  <g id="base-shape" filter="url(#tile-shadow)">
    <!-- Top-Left Tile -->
    <rect x="4" y="4" width="26" height="26" rx="4" ry="4" fill="url(#backtile-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Top-Right Tile -->
    <rect x="34" y="4" width="26" height="26" rx="4" ry="4" fill="url(#backtile-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Bottom-Left Tile -->
    <rect x="4" y="34" width="26" height="26" rx="4" ry="4" fill="url(#backtile-grad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Bottom-Right Tile -->
    <rect x="34" y="34" width="26" height="26" rx="4" ry="4" fill="url(#backtile-grad)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- 2. Surface Details: Inset Bevels & Subtle Grid Lines -->
  <g id="surface-details">
    <!-- Top-Left Inset -->
    <rect x="7" y="7" width="20" height="20" rx="2" ry="2" fill="#1B5E20" opacity="0.35"/>
    <rect x="8" y="8" width="18" height="18" rx="1.5" ry="1.5" fill="none" stroke="var(--color-asset-highlight, #81C784)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

    <!-- Top-Right Inset -->
    <rect x="37" y="7" width="20" height="20" rx="2" ry="2" fill="#1B5E20" opacity="0.35"/>
    <rect x="38" y="8" width="18" height="18" rx="1.5" ry="1.5" fill="none" stroke="var(--color-asset-highlight, #81C784)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

    <!-- Bottom-Left Inset -->
    <rect x="7" y="37" width="20" height="20" rx="2" ry="2" fill="#1B5E20" opacity="0.35"/>
    <rect x="8" y="38" width="18" height="18" rx="1.5" ry="1.5" fill="none" stroke="var(--color-asset-highlight, #81C784)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

    <!-- Bottom-Right Inset -->
    <rect x="37" y="37" width="20" height="20" rx="2" ry="2" fill="#1B5E20" opacity="0.35"/>
    <rect x="38" y="38" width="18" height="18" rx="1.5" ry="1.5" fill="none" stroke="var(--color-asset-highlight, #81C784)" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  </g>

  <!-- 3. Highlights: Top Edge Specular Highlights -->
  <g id="highlights">
    <path d="M 6 5 L 28 5 C 29 5, 29 6, 28 6 L 8 6 C 7 6, 6 5, 6 5 Z" fill="#FFFFFF" opacity="0.7"/>
    <path d="M 36 5 L 58 5 C 59 5, 59 6, 58 6 L 38 6 C 37 6, 36 5, 36 5 Z" fill="#FFFFFF" opacity="0.7"/>
    <path d="M 6 35 L 28 35 C 29 35, 29 36, 28 36 L 8 36 C 7 36, 6 35, 6 35 Z" fill="#FFFFFF" opacity="0.7"/>
    <path d="M 36 35 L 58 35 C 59 35, 59 36, 58 36 L 38 36 C 37 36, 36 35, 36 35 Z" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
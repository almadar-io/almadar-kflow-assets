    <line x1="3" y1="3" x2="32" y2="3" stroke="#81C784" stroke-width="1.5" opacity="0.5"/>
    <line x1="32" y1="3" x2="61" y2="3" stroke="#81C784" stroke-width="1.5" opacity="0.5"/>
    <line x1="3" y1="32" x2="32" y2="32" stroke="#81C784" stroke-width="1.5" opacity="0.5"/>
    <line x1="32" y1="32" x2="61" y2="32" stroke="#81C784" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g id="highlights">

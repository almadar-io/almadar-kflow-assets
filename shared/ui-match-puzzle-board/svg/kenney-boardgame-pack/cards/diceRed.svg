<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dice-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-highlight, #BAE6FD)"/>
      <stop offset="35%" stop-color="var(--color-asset-primary, #38BDF8)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0284C7)"/>
    </linearGradient>
    <linearGradient id="dice-side-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-secondary, #0284C7)"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="dice-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Rounded Die Body -->
  <g id="base-shape" filter="url(#dice-shadow)">
    <!-- Main Die Body (Isometric Angle Rounded Cube) -->
    <rect x="8" y="8" width="48" height="48" rx="10" ry="10" fill="url(#dice-red-grad)" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Bottom Bevel Shading -->
    <path d="M 8 44 C 8 52, 12 56, 18 56 L 46 56 C 52 56, 56 52, 56 44 L 56 40 L 8 40 Z" fill="url(#dice-side-grad)" opacity="0.6"/>
  </g>

  <!-- 2. Surface Details: White Pips (Die Dots) & Inner Rim -->
  <g id="surface-details">
    <!-- Inner Rim Stroke -->
    <rect x="11" y="11" width="42" height="42" rx="7" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

    <!-- Pips Configuration: 5 Dot Layout -->
    <!-- Top-Left Pip -->
    <circle cx="21" cy="21" r="4.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="1.5" fill="#E0F2FE"/>

    <!-- Top-Right Pip -->
    <circle cx="43" cy="21" r="4.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="42" cy="20" r="1.5" fill="#E0F2FE"/>

    <!-- Center Pip -->
    <circle cx="32" cy="32" r="4.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="31" cy="31" r="1.5" fill="#E0F2FE"/>

    <!-- Bottom-Left Pip -->
    <circle cx="21" cy="43" r="4.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="20" cy="42" r="1.5" fill="#E0F2FE"/>

    <!-- Bottom-Right Pip -->
    <circle cx="43" cy="43" r="4.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="42" cy="42" r="1.5" fill="#E0F2FE"/>
  </g>

  <!-- 3. Highlights: Top & Left Gloss Streaks -->
  <g id="highlights">
    <!-- Top Edge Glint -->
    <path d="M 16 10 L 48 10 C 52 10, 54 12, 54 14 C 50 12, 14 12, 10 14 C 10 12, 12 10, 16 10 Z" fill="#FFFFFF" opacity="0.65"/>
    <!-- Diagonal Corner Gloss -->
    <path d="M 12 18 C 12 14, 14 12, 18 12 C 22 12, 12 22, 12 18 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
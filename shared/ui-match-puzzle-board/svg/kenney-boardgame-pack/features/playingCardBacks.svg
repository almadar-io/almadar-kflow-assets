    <rect x="13" y="9" width="30" height="46" rx="3" fill="url(#weave)" clip-path="url(#card)"/>
  </g>
  <g id="surface-details">
    <rect x="13" y="9" width="30" height="46" rx="3" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
    <path d="M28 20 L42 32 L28 44 L14 32 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
    <path d="M28 26 L36 32 L28 38 L20 32 Z" fill="#81C784"/>

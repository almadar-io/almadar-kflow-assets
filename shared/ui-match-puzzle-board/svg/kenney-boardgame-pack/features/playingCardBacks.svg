<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="0.5" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1B5E20" stroke-width="1" opacity="0.45"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#2E7D32" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect x="8" y="6" width="34" height="52" rx="4"/></clipPath>
  </defs>
  <g id="base-shape">
    <rect x="11" y="8" width="36" height="52" rx="5" fill="#1B5E20"/>

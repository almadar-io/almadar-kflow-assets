<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="card-face-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="cards-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Card Base & Outline -->
  <g id="base-shape" filter="url(#cards-shadow)">
    <!-- Backing Card (Offset Fan) -->
    <rect x="20" y="4" width="36" height="52" rx="4" ry="4" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1.5" transform="rotate(8 38 30)"/>
    <!-- Main Card Body -->
    <rect x="12" y="6" width="36" height="52" rx="4" ry="4" fill="url(#card-face-bg)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- 2. Surface Details: Rank Corner Identifiers & Center Ace Emblem -->
  <g id="surface-details">
    <!-- Inner Fine Border Frame -->
    <rect x="15" y="9" width="30" height="46" rx="2.5" ry="2.5" fill="none" stroke="var(--color-asset-primary, #4CAF50)" stroke-width="1" opacity="0.4"/>

    <!-- Top-Left Corner Rank 'A' & Suit -->
    <text x="18" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="var(--color-asset-primary, #4CAF50)">A</text>
    <!-- Spade / Diamond Suit Symbol Top-Left -->
    <path d="M 19.5 22.5 L 21.5 25.5 L 19.5 28.5 L 17.5 25.5 Z" fill="var(--color-asset-primary, #4CAF50)"/>

    <!-- Bottom-Right Inverted Corner Rank 'A' & Suit -->
    <g transform="rotate(180 30 32)">
      <text x="18" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="var(--color-asset-primary, #4CAF50)">A</text>
      <path d="M 19.5 22.5 L 21.5 25.5 L 19.5 28.5 L 17.5 25.5 Z" fill="var(--color-asset-primary, #4CAF50)"/>
    </g>

    <!-- Center Large Crest / Spade Motif -->
    <!-- Spade contour -->
    <path d="M 30 22 C 30 22, 21 31, 21 36 C 21 39.5, 24 41, 26.5 41 C 28.5 41, 29.5 39.5, 30 38.5 C 30.5 39.5, 31.5 41, 33.5 41 C 36 41, 39 39.5, 39 36 C 39 31, 30 22, 30 22 Z" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="1.2"/>
    <!-- Spade Base Stand -->
    <path d="M 28 39 L 32 39 L 34 43.5 L 26 43.5 Z" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- 3. Highlights: Surface Sheen & Highlights -->
  <g id="highlights">
    <path d="M 13 8 L 45 8 C 47 8, 46 10, 44 10 L 15 10 C 13 10, 13 8, 13 8 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- Center Spade Highlight Curve -->
    <path d="M 30 25 C 28 29, 24 33, 23 35 C 24 33, 27 29, 30 25 Z" fill="var(--color-asset-highlight, #81C784)" opacity="0.9"/>
  </g>
</svg>
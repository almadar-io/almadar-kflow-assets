<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="border-w-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="var(--color-asset-primary, #38BDF8)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0284C7)"/>
    </linearGradient>
    <filter id="border-w-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Outer Frame Shell -->
  <g id="base-shape" filter="url(#border-w-shadow)">
    <!-- Outer Border Frame -->
    <rect x="4" y="4" width="56" height="56" rx="8" ry="8" fill="url(#border-w-grad)" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Inner Inset Cutout / Slot -->
    <rect x="10" y="10" width="44" height="44" rx="5" ry="5" fill="#F8FAFC" stroke="var(--color-asset-secondary, #0284C7)" stroke-width="1.5"/>
  </g>

  <!-- 2. Surface Details: Inset Shadow & Patterning -->
  <g id="surface-details">
    <!-- Inner Top-Left Shadow -->
    <path d="M 10 10 L 54 10 L 54 14 L 14 14 L 14 54 L 10 54 Z" fill="var(--color-asset-primary, #38BDF8)" opacity="0.3"/>
    
    <!-- Corner Hardware / Decorative Tabs -->
    <rect x="6" y="6" width="5" height="5" fill="#1E293B" rx="1"/>
    <rect x="53" y="6" width="5" height="5" fill="#1E293B" rx="1"/>
    <rect x="6" y="53" width="5" height="5" fill="#1E293B" rx="1"/>
    <rect x="53" y="53" width="5" height="5" fill="#1E293B" rx="1"/>

    <!-- Inner Slot Guideline -->
    <rect x="12" y="12" width="40" height="40" rx="4" ry="4" fill="none" stroke="var(--color-asset-secondary, #0284C7)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  </g>

  <!-- 3. Highlights: Bright Edge Glints -->
  <g id="highlights">
    <!-- Top Edge Highlight -->
    <path d="M 10 5 L 54 5 C 57 5, 58 7, 58 8 L 6 8 C 6 7, 7 5, 10 5 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Top-Left Corner Glint -->
    <circle cx="12" cy="12" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
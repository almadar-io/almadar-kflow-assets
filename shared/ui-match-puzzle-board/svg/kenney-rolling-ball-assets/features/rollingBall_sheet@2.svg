<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rball2-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="65%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </radialGradient>
    <filter id="rball2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Dual Keyframe Rolling Balls -->
  <g id="base-shape" filter="url(#rball2-shadow)">
    <!-- Motion Trail Lines -->
    <path d="M 4 20 Q 14 10, 24 20" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 20 50 Q 30 40, 40 50" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Keyframe 1: Top Right Ball -->
    <circle cx="44" cy="20" r="15" fill="url(#rball2-grad)" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Keyframe 2: Bottom Left Ball -->
    <circle cx="20" cy="44" r="15" fill="url(#rball2-grad)" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- 2. Surface Details: Rotation Ribs & Inset Patterns -->
  <g id="surface-details">
    <!-- Top Right Ball Seams -->
    <ellipse cx="44" cy="20" rx="10" ry="5" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="1.5" transform="rotate(30 44 20)"/>
    <circle cx="44" cy="20" r="2.5" fill="#FFFFFF"/>

    <!-- Bottom Left Ball Seams -->
    <ellipse cx="20" cy="44" rx="10" ry="5" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="1.5" transform="rotate(-45 20 44)"/>
    <circle cx="20" cy="44" r="2.5" fill="#FFFFFF"/>

    <!-- Connecting Dynamic Speed Lines -->
    <line x1="33" y1="29" x2="31" y2="35" stroke="var(--color-asset-highlight, #81C784)" stroke-width="2" stroke-dasharray="3 2"/>
  </g>

  <!-- 3. Highlights: Specular Spot Highlights -->
  <g id="highlights">
    <!-- Top Right Ball Glint -->
    <circle cx="39" cy="14" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="41" cy="17" r="1" fill="#FFFFFF"/>

    <!-- Bottom Left Ball Glint -->
    <circle cx="15" cy="38" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="17" cy="41" r="1" fill="#FFFFFF"/>
  </g>
</svg>
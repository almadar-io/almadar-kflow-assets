<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rball-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="var(--color-asset-highlight, #81C784)"/>
      <stop offset="65%" stop-color="var(--color-asset-primary, #4CAF50)"/>
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)"/>
    </radialGradient>
    <filter id="rball-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Shape: Rolling Sphere & Motion Blur Trail -->
  <g id="base-shape" filter="url(#rball-shadow)">
    <!-- Motion Speed Arc Curves / Trails Behind Ball -->
    <path d="M 6 36 C 12 28, 20 28, 26 36" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 10 44 C 18 36, 24 36, 30 44" fill="none" stroke="var(--color-asset-primary, #4CAF50)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Main Rolling Ball Body -->
    <circle cx="38" cy="32" r="20" fill="url(#rball-grad)" stroke="#1E293B" stroke-width="2.5"/>
  </g>

  <!-- 2. Surface Details: Rotating Curved Seams & Motion Ribs -->
  <g id="surface-details">
    <!-- Curved Rotation Lines (Spin Effect) -->
    <path d="M 24 24 C 32 32, 44 32, 52 24" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="2" opacity="0.7"/>
    <path d="M 24 40 C 32 32, 44 32, 52 40" fill="none" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="2" opacity="0.7"/>
    <path d="M 38 12 C 38 24, 38 40, 38 52" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

    <!-- Center Swirl Core -->
    <circle cx="38" cy="32" r="5" fill="#1B5E20" opacity="0.5"/>
    <circle cx="38" cy="32" r="3" fill="#FFFFFF"/>
  </g>

  <!-- 3. Highlights: Specular Refraction Spotlights -->
  <g id="highlights">
    <!-- Top-Left Curved Glint -->
    <ellipse cx="30" cy="22" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 30 22)"/>
    <circle cx="34" cy="26" r="1.5" fill="#FFFFFF"/>

    <!-- Fast Dust Sparkle Particle Dots -->
    <circle cx="14" cy="24" r="1" fill="var(--color-asset-highlight, #81C784)"/>
    <circle cx="18" cy="18" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
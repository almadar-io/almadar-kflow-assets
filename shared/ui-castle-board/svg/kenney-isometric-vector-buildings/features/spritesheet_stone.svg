<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #94A3B8)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Top face stone masonry grid -->
    <line x1="19" y1="11" x2="45" y2="25" stroke="#64748B" stroke-width="0.8" opacity="0.6"/>
    <line x1="19" y1="25" x2="45" y2="11" stroke="#64748B" stroke-width="0.8" opacity="0.6"/>
    <polygon points="32,8 48,17 32,25 16,17" fill="#CBD5E1" opacity="0.3"/>
  </g>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #64748B)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left face stone course lines -->
    <path d="M 6,31 L 32,45 M 6,38 L 32,52" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <line x1="19" y1="25" x2="19" y2="38" stroke="#334155" stroke-width="1" opacity="0.7"/>
    <line x1="25" y1="41" x2="25" y2="54" stroke="#334155" stroke-width="1" opacity="0.7"/>
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#334155" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right face stone course lines -->
    <path d="M 32,45 L 58,31 M 32,52 L 58,38" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
    <line x1="45" y1="25" x2="45" y2="38" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
    <line x1="39" y1="41" x2="39" y2="54" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
  </g>
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" stroke="#CBD5E1" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <line x1="32" y1="4" x2="32" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
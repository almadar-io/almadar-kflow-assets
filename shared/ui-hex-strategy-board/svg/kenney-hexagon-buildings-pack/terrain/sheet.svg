<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Isometric Buildings / Houses -->
    <!-- Main House Center -->
    <g transform="translate(32,32)">
      <!-- Base Walls -->
      <polygon points="0,0 10,-5 10,-15 0,-10" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,0 -10,-5 -10,-15 0,-10" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <!-- Roof -->
      <polygon points="0,-22 12,-16 0,-10 -12,-16" fill="#1B5E20" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,-22 0,-10 -12,-16" fill="#2E7D32" />
      <!-- Door -->
      <polygon points="-4,-2 0,0 0,-6 -4,-8" fill="#1B5E20" />
      <!-- Window -->
      <polygon points="4,-8 7,-9.5 7,-12 4,-10.5" fill="#81C784" />
    </g>
    <!-- Small Side Cottage (Left) -->
    <g transform="translate(18,24) scale(0.7)">
      <polygon points="0,0 8,-4 8,-12 0,-8" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,0 -8,-4 -8,-12 0,-8" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,-16 10,-11 0,-6 -10,-11" fill="#1B5E20" stroke="#1B5E20" stroke-width="1" />
    </g>
    <!-- Cobblestone Path -->
    <path d="M 32 32 L 32 46 M 28 36 L 36 38 M 30 42 L 34 44" stroke="#1B5E20" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round" fill="none" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
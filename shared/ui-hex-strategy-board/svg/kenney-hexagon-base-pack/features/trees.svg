<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- 3D Pine Tree 1 (Center) -->
    <g transform="translate(32,30)">
      <!-- Trunk -->
      <rect x="-2" y="6" width="4" height="8" fill="#1B5E20" rx="1" />
      <!-- Tree Cones / Layers -->
      <polygon points="0,-16 -12,2 12,2" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,-16 0,2 12,2" fill="#1B5E20" opacity="0.3" />
      <polygon points="0,-10 -10,6 10,6" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" />
      <polygon points="0,-10 0,6 10,6" fill="#2E7D32" opacity="0.3" />
      <polygon points="0,-4 -8,10 8,10" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
    </g>
    <!-- 3D Deciduous Tree 2 (Left Back) -->
    <g transform="translate(20,22) scale(0.75)">
      <rect x="-2" y="4" width="4" height="8" fill="#1B5E20" />
      <circle cx="0" cy="-4" r="10" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-3" cy="-6" r="6" fill="#81C784" />
    </g>
    <!-- Small Tree 3 (Right Back) -->
    <g transform="translate(44,24) scale(0.7)">
      <rect x="-2" y="4" width="4" height="8" fill="#1B5E20" />
      <polygon points="0,-12 -8,4 8,4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
    </g>
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
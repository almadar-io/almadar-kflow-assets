<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="alien-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81C784" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
    <!-- Sci-fi Aura -->
    <circle cx="32" cy="30" r="18" fill="url(#alien-aura)" />
  </g>
  <g id="hex-terrain-details">
    <!-- Alien Flying Saucer / Unit Model -->
    <g transform="translate(32,28)">
      <!-- Saucer Dome -->
      <path d="M -8 -2 C -8 -10, 8 -10, 8 -2 Z" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <!-- Dome Specular Highlight -->
      <ellipse cx="-2" cy="-6" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.8" />
      <!-- Main Saucer Body -->
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.2" />
      <!-- Saucer Lights -->
      <circle cx="-10" cy="1" r="1" fill="#FFFFFF" />
      <circle cx="-4" cy="2" r="1" fill="#FFFFFF" />
      <circle cx="4" cy="2" r="1" fill="#FFFFFF" />
      <circle cx="10" cy="1" r="1" fill="#FFFFFF" />
      <!-- Abduction Tractor Beam -->
      <polygon points="-6,5 6,5 12,18 -12,18" fill="#81C784" opacity="0.4" />
    </g>
    <!-- Targeting Crosshair Reticle -->
    <circle cx="32" cy="30" r="16" fill="none" stroke="#1B5E20" stroke-width="0.8" stroke-dasharray="4,4" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
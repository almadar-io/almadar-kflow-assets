<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fish-water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.35" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.45" />
  </g>
  <g id="hex-terrain-details">
    <!-- Water Waves & Ripples -->
    <path d="M 14 22 C 20 18, 26 26, 32 22 C 38 18, 44 26, 50 22" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 10 32 C 18 28, 24 36, 32 32 C 40 28, 46 36, 54 32" fill="none" stroke="#81C784" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <!-- Two Fish Silhouettes (Double) -->
    <!-- Fish 1 (Top Right) -->
    <g transform="translate(36,24) scale(0.8)">
      <path d="M -8 0 C -2 -6, 6 -4, 10 0 C 6 4, -2 6, -8 0 Z" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <polygon points="-8,0 -14,-4 -12,0 -14,4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <circle cx="6" cy="-1" r="1" fill="#1E293B" />
    </g>
    <!-- Fish 2 (Bottom Left) -->
    <g transform="translate(24,40) scale(0.8) rotate(-15)">
      <path d="M -8 0 C -2 -6, 6 -4, 10 0 C 6 4, -2 6, -8 0 Z" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <polygon points="-8,0 -14,-4 -12,0 -14,4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <circle cx="6" cy="-1" r="1" fill="#1E293B" />
    </g>
    <!-- Sea Grass / Coral -->
    <path d="M 16 46 Q 18 36 14 30 M 20 46 Q 24 38 22 32 M 48 46 Q 44 38 46 32" fill="none" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
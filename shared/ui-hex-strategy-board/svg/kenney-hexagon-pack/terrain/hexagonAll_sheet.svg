<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Winding River Stream -->
    <path d="M 6 22 C 16 20, 24 30, 32 30 C 40 30, 44 42, 58 44" fill="none" stroke="#81C784" stroke-width="6" stroke-linecap="round" />
    <path d="M 6 22 C 16 20, 24 30, 32 30 C 40 30, 44 42, 58 44" fill="none" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <!-- Mountain Peak (Top Right) -->
    <polygon points="40,24 48,10 56,24" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
    <polygon points="48,10 56,24 48,24" fill="#1B5E20" />
    <polygon points="48,10 46,14 50,14" fill="#81C784" />
    <!-- Forest Patch (Top Left) -->
    <g transform="translate(18,16) scale(0.6)">
      <polygon points="0,-10 -8,4 8,4" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <polygon points="8,-10 0,4 16,4" fill="#1B5E20" stroke="#1B5E20" stroke-width="1" />
    </g>
    <!-- Dotted Road / Trail (Bottom Left to Right) -->
    <path d="M 12 42 Q 24 40 34 50" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="2,2" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
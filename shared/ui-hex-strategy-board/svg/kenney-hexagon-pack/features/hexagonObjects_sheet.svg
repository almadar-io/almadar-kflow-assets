<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Resource Objects: Treasure Chest & Wood Logs -->
    <!-- Treasure Chest (Center) -->
    <g transform="translate(32,30)">
      <rect x="-8" y="-4" width="16" height="10" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" rx="1" />
      <path d="M -8 -4 C -8 -9, 8 -9, 8 -4 Z" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <!-- Metallic Bands & Lock -->
      <line x1="-4" y1="-7" x2="-4" y2="6" stroke="#1B5E20" stroke-width="1.2" />
      <line x1="4" y1="-7" x2="4" y2="6" stroke="#1B5E20" stroke-width="1.2" />
      <circle cx="0" cy="1" r="1.5" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
    </g>
    <!-- Wood Logs Stack (Left) -->
    <g transform="translate(18,24) scale(0.8)">
      <ellipse cx="-4" cy="4" rx="3" ry="5" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <rect x="-4" y="-1" width="12" height="10" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <ellipse cx="8" cy="4" rx="3" ry="5" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
    </g>
    <!-- Gold Nodule Sparkles -->
    <polygon points="46,22 47,20 48,22 50,23 48,24 47,26 46,24 44,23" fill="#81C784" />
    <polygon points="42,34 43,32 44,34 46,35 44,36 43,38 42,36 40,35" fill="#81C784" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
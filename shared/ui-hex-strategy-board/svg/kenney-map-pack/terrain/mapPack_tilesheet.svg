<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Mountain Chain Across Center -->
    <!-- Peak 1 -->
    <polygon points="16,36 24,20 32,36" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
    <polygon points="24,20 32,36 24,36" fill="#2E7D32" />
    <!-- Peak 2 (Highest) -->
    <polygon points="26,34 36,14 46,34" fill="#81C784" stroke="#1B5E20" stroke-width="1.2" />
    <polygon points="36,14 46,34 36,34" fill="#1B5E20" />
    <polygon points="36,14 34,18 38,18" fill="#FFFFFF" />
    <!-- Peak 3 -->
    <polygon points="38,36 44,24 50,36" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
    <!-- River Bend -->
    <path d="M 10 44 Q 26 40 32 46 T 54 44" fill="none" stroke="#2E7D32" stroke-width="2.5" />
    <path d="M 10 44 Q 26 40 32 46 T 54 44" fill="none" stroke="#81C784" stroke-width="1" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Foliage Shrub Clusters -->
    <!-- Bush 1 (Center) -->
    <g transform="translate(32,32)">
      <circle cx="-6" cy="-4" r="8" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <circle cx="6" cy="-4" r="8" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" />
      <circle cx="0" cy="-8" r="9" fill="#81C784" stroke="#1B5E20" stroke-width="1" />
      <circle cx="0" cy="2" r="7" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <!-- Leaf highlights -->
      <path d="M -2 -11 Q 0 -14 2 -11" fill="none" stroke="#81C784" stroke-width="1" />
    </g>
    <!-- Bush 2 (Left) -->
    <g transform="translate(18,24) scale(0.7)">
      <circle cx="0" cy="0" r="8" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-3" cy="-3" r="6" fill="#81C784" />
    </g>
    <!-- Bush 3 (Right) -->
    <g transform="translate(46,26) scale(0.7)">
      <circle cx="0" cy="0" r="8" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-2" cy="-2" r="6" fill="#4CAF50" />
    </g>
    <!-- Grass blades -->
    <path d="M 22 44 L 20 38 L 24 44 M 40 46 L 42 40 L 44 46" stroke="#1B5E20" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
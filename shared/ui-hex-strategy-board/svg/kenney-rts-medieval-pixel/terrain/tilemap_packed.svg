<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="hex-base">
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="32,60 58,46 58,18 32,32" fill="#1B5E20" opacity="0.3" />
    <polygon points="32,60 6,46 32,32" fill="#2E7D32" stroke-opacity="0.3" opacity="0.4" />
  </g>
  <g id="hex-terrain-details">
    <!-- Pixelated Stone Wall & Fortress Gate -->
    <g transform="translate(32,32)">
      <!-- Stone Wall Blocks (Grid-aligned pixel styling) -->
      <rect x="-14" y="-8" width="28" height="16" fill="#2E7D32" stroke="#1B5E20" stroke-width="1" />
      <rect x="-14" y="-8" width="14" height="8" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
      <rect x="0" y="0" width="14" height="8" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
      <!-- Wall Merlons / Battlements -->
      <rect x="-14" y="-14" width="6" height="6" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
      <rect x="-3" y="-14" width="6" height="6" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
      <rect x="8" y="-14" width="6" height="6" fill="#81C784" stroke="#1B5E20" stroke-width="0.8" />
      <!-- Archway Door -->
      <rect x="-4" y="0" width="8" height="8" fill="#1B5E20" />
      <!-- Medieval Banner -->
      <polygon points="12,-6 16,-6 16,4 14,2 12,4" fill="#81C784" stroke="#1B5E20" stroke-width="0.6" />
    </g>
    <!-- Pixel Cobblestone Path -->
    <rect x="18" y="44" width="4" height="4" fill="#1B5E20" />
    <rect x="24" y="46" width="4" height="4" fill="#2E7D32" />
    <rect x="36" y="46" width="4" height="4" fill="#1B5E20" />
    <rect x="42" y="44" width="4" height="4" fill="#2E7D32" />
  </g>
  <g id="hex-highlight">
    <polygon points="32,7.5 55,19.5 55,44.5 32,56.5 9,44.5 9,19.5" fill="none" stroke="#81C784" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
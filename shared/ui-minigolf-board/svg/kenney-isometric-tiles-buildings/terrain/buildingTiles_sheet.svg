<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="32,10 48,18 32,26 16,18" fill="none" stroke="#81C784" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  </g>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Building wall window apertures / panels on left face -->
    <polygon points="12,25 22,30 22,42 12,37" fill="#1B5E20" opacity="0.6" stroke="#1E293B" stroke-width="0.8" />
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#1B5E20" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Building wall window apertures / panels on right face -->
    <polygon points="42,30 52,25 52,37 42,42" fill="#0F380F" opacity="0.7" stroke="#1E293B" stroke-width="0.8" />
  </g>
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" fill="none" stroke="#81C784" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <line x1="32" y1="4" x2="32" y2="32" stroke="#81C784" stroke-width="1" opacity="0.6" />
  </g>
</svg>
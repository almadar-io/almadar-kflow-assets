<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #FDE047)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="32,8 52,18 32,28 12,18" fill="#FEF08A" opacity="0.4" />
    <!-- Sand dune ripple waves -->
    <path d="M 16,14 C 22,12 28,16 34,14 C 40,12 46,16 52,14" fill="none" stroke="#EAB308" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M 12,20 C 20,18 28,22 36,20 C 44,18 50,21 54,20" fill="none" stroke="#EAB308" stroke-width="1" stroke-linecap="round" opacity="0.5" />
  </g>
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #EAB308)" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 6,26 C 14,30 24,34 32,40 M 6,36 C 14,40 24,44 32,50" stroke="#CA8A04" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  </g>
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#CA8A04" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 32,40 C 40,34 50,30 58,26 M 32,50 C 40,44 50,40 58,36" stroke="#854D0E" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  </g>
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" fill="none" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <line x1="32" y1="4" x2="32" y2="32" stroke="#FEF08A" stroke-width="1" opacity="0.6" />
  </g>
</svg>
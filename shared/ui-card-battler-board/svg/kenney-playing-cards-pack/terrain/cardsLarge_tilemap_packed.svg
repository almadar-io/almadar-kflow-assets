<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 716" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-primary, #1E293B)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0F172A)" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Card Background Layer -->
  <g id="card-background">
    <rect x="16" y="16" width="480" height="684" rx="24" fill="url(#cardBgGrad)" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />
    <rect x="24" y="24" width="464" height="668" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- 2. Inner Frame Layer -->
  <g id="card-inner-frame">
    <rect x="36" y="36" width="440" height="644" rx="16" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="12 6" />
    <path d="M 44 60 L 60 44 M 44 44 L 60 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 60 L 452 44 M 468 44 L 452 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 44 656 L 60 672 M 44 672 L 60 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 656 L 452 672 M 468 672 L 452 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 3. Corner Ranks Layer -->
  <g id="card-corner-ranks">
    <g transform="translate(56, 60)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">CAR</text>
      <rect x="12" y="44" width="24" height="30" rx="3" fill="none" stroke="var(--color-asset-primary, #1E293B)" stroke-width="2" />
    </g>
    <g transform="translate(456, 656) rotate(180)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">CAR</text>
      <rect x="12" y="44" width="24" height="30" rx="3" fill="none" stroke="var(--color-asset-primary, #1E293B)" stroke-width="2" />
    </g>
  </g>

  <!-- 4. Center Emblem Layer -->
  <g id="card-center-emblem">
    <!-- 2x2 Large Cards Tilemap Grid -->
    <g transform="translate(256, 356)">
      <!-- Tilemap Grid Outer Border -->
      <rect x="-140" y="-170" width="280" height="340" rx="16" fill="#F1F5F9" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />

      <!-- Top Left Tile (Spades) -->
      <rect x="-125" y="-155" width="120" height="145" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
      <path d="M -65 -100 C -75 -75 -90 -70 -80 -55 C -70 -40 -65 -50 -65 -50 C -65 -50 -60 -40 -50 -55 C -40 -70 -55 -75 -65 -100 Z M -70 -50 L -60 -50 L -57 -40 L -73 -40 Z" fill="url(#primaryGrad)" />
      <text x="-115" y="-130" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--color-asset-primary, #1E293B)">A</text>

      <!-- Top Right Tile (Hearts) -->
      <rect x="5" y="-155" width="120" height="145" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
      <path d="M 65 -90 C 60 -105 40 -105 38 -90 C 36 -75 65 -55 65 -55 C 65 -55 94 -75 92 -90 C 90 -105 70 -105 65 -90 Z" fill="#EF4444" />
      <text x="15" y="-130" font-family="sans-serif" font-size="18" font-weight="bold" fill="#EF4444">K</text>

      <!-- Bottom Left Tile (Diamonds) -->
      <rect x="-125" y="10" width="120" height="145" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
      <polygon points="-65,55 -45,82.5 -65,110 -85,82.5" fill="#EF4444" />
      <text x="-115" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#EF4444">Q</text>

      <!-- Bottom Right Tile (Clubs) -->
      <rect x="5" y="10" width="120" height="145" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
      <circle cx="65" cy="72.5" r="12" fill="url(#primaryGrad)" />
      <circle cx="53" cy="84.5" r="12" fill="url(#primaryGrad)" />
      <circle cx="77" cy="84.5" r="12" fill="url(#primaryGrad)" />
      <polygon points="61,84.5 69,84.5 73,104.5 57,104.5" fill="url(#primaryGrad)" />
      <text x="15" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="var(--color-asset-primary, #1E293B)">J</text>

      <!-- Grid Line Overlay -->
      <line x1="0" y1="-170" x2="0" y2="170" stroke="#81C784" stroke-width="3" />
      <line x1="-140" y1="0" x2="140" y2="0" stroke="#81C784" stroke-width="3" />
    </g>
  </g>
</svg>
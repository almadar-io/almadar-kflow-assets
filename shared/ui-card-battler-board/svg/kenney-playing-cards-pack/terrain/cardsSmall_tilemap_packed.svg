<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 716" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-primary, #1E293B)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0F172A)" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Card Background Layer -->
  <g id="card-background">
    <rect x="16" y="16" width="480" height="684" rx="24" fill="url(#cardBgGrad)" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />
    <rect x="24" y="24" width="464" height="668" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- 2. Inner Frame Layer -->
  <g id="card-inner-frame">
    <rect x="36" y="36" width="440" height="644" rx="16" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="12 6" />
    <path d="M 44 60 L 60 44 M 44 44 L 60 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 60 L 452 44 M 468 44 L 452 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 44 656 L 60 672 M 44 672 L 60 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 656 L 452 672 M 468 672 L 452 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 3. Corner Ranks Layer -->
  <g id="card-corner-ranks">
    <g transform="translate(56, 60)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">CAR</text>
      <rect x="12" y="44" width="24" height="30" rx="3" fill="none" stroke="var(--color-asset-primary, #1E293B)" stroke-width="2" />
    </g>
    <g transform="translate(456, 656) rotate(180)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">CAR</text>
      <rect x="12" y="44" width="24" height="30" rx="3" fill="none" stroke="var(--color-asset-primary, #1E293B)" stroke-width="2" />
    </g>
  </g>

  <!-- 4. Center Emblem Layer -->
  <g id="card-center-emblem">
    <!-- 4x3 Small Cards Grid -->
    <g transform="translate(256, 356)">
      <rect x="-140" y="-160" width="280" height="320" rx="16" fill="#F1F5F9" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />

      <!-- Grid of 12 Mini Cards -->
      <!-- Row 1 -->
      <rect x="-125" y="-145" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="-97.5" cy="-102.5" r="8" fill="url(#primaryGrad)" />

      <rect x="-55" y="-145" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <polygon points="-27.5,-110 -20,-102.5 -27.5,-95 -35,-102.5" fill="#EF4444" />

      <rect x="15" y="-145" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <path d="M 42.5 -108 C 40 -114 30 -114 30 -108 C 30 -100 42.5 -92 42.5 -92 C 42.5 -92 55 -100 55 -108 C 55 -114 45 -114 42.5 -108 Z" fill="#EF4444" />

      <rect x="80" y="-145" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="107.5" cy="-102.5" r="6" fill="url(#primaryGrad)" />

      <!-- Row 2 -->
      <rect x="-125" y="-42.5" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <text x="-106" y="10" font-family="sans-serif" font-size="20" font-weight="bold" fill="#EF4444">10</text>

      <rect x="-55" y="-42.5" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <text x="-34" y="10" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--color-asset-primary, #1E293B)">J</text>

      <rect x="15" y="-42.5" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <text x="34" y="10" font-family="sans-serif" font-size="20" font-weight="bold" fill="#EF4444">Q</text>

      <rect x="80" y="-42.5" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <text x="98" y="10" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--color-asset-primary, #1E293B)">K</text>

      <!-- Row 3 -->
      <rect x="-125" y="60" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <text x="-104" y="112" font-family="sans-serif" font-size="20" font-weight="bold" fill="var(--color-asset-primary, #1E293B)">A</text>

      <rect x="-55" y="60" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="-27.5" cy="102.5" r="7" fill="#EF4444" />

      <rect x="15" y="60" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <polygon points="42.5,95 50,102.5 42.5,110 35,102.5" fill="#EF4444" />

      <rect x="80" y="60" width="55" height="85" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="107.5" cy="102.5" r="7" fill="url(#primaryGrad)" />
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 716" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-asset-primary, #1E293B)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0F172A)" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Card Background Layer -->
  <g id="card-background">
    <rect x="16" y="16" width="480" height="684" rx="24" fill="url(#cardBgGrad)" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />
    <rect x="24" y="24" width="464" height="668" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- 2. Inner Frame Layer -->
  <g id="card-inner-frame">
    <rect x="36" y="36" width="440" height="644" rx="16" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="12 6" />
    <path d="M 44 60 L 60 44 M 44 44 L 60 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 60 L 452 44 M 468 44 L 452 60" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 44 656 L 60 672 M 44 672 L 60 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
    <path d="M 468 656 L 452 672 M 468 672 L 452 656" stroke="#81C784" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 3. Corner Ranks Layer -->
  <g id="card-corner-ranks">
    <g transform="translate(56, 60)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">SPR</text>
      <rect x="10" y="44" width="18" height="18" rx="3" fill="url(#gemGrad)" stroke="#1E293B" stroke-width="1.5" />
      <rect x="20" y="52" width="18" height="18" rx="3" fill="#3B82F6" stroke="#1E293B" stroke-width="1.5" />
    </g>
    <g transform="translate(456, 656) rotate(180)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="var(--color-asset-primary, #1E293B)">SPR</text>
      <rect x="10" y="44" width="18" height="18" rx="3" fill="url(#gemGrad)" stroke="#1E293B" stroke-width="1.5" />
      <rect x="20" y="52" width="18" height="18" rx="3" fill="#3B82F6" stroke="#1E293B" stroke-width="1.5" />
    </g>
  </g>

  <!-- 4. Center Emblem Layer -->
  <g id="card-center-emblem">
    <g transform="translate(256, 356)">
      <!-- Back Spritesheet Plate -->
      <g transform="translate(-30, -30)">
        <rect x="-100" y="-100" width="200" height="200" rx="16" fill="url(#primaryGrad)" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />
        <rect x="-88" y="-88" width="176" height="176" rx="10" fill="#E2E8F0" stroke="#81C784" stroke-width="2" />
        <rect x="-75" y="-75" width="65" height="65" rx="8" fill="#3B82F6" />
        <rect x="10" y="-75" width="65" height="65" rx="8" fill="#EC4899" />
        <rect x="-75" y="10" width="65" height="65" rx="8" fill="#10B981" />
        <rect x="10" y="10" width="65" height="65" rx="8" fill="#F59E0B" />
      </g>

      <!-- Front Spritesheet Plate -->
      <g transform="translate(30, 30)">
        <rect x="-100" y="-100" width="200" height="200" rx="16" fill="url(#primaryGrad)" stroke="#1E293B" stroke-width="4" filter="url(#dropShadow)" />
        <rect x="-88" y="-88" width="176" height="176" rx="10" fill="#FFFFFF" stroke="#81C784" stroke-width="2" />
        <rect x="-75" y="-75" width="65" height="65" rx="8" fill="url(#gemGrad)" stroke="#1E293B" stroke-width="2" />
        <circle cx="-42.5" cy="-42.5" r="14" fill="#FFFFFF" />
        <rect x="10" y="-75" width="65" height="65" rx="8" fill="#8B5CF6" stroke="#1E293B" stroke-width="2" />
        <polygon points="42.5,-58 55,-28 30,-28" fill="#FFFFFF" />
        <rect x="-75" y="10" width="65" height="65" rx="8" fill="#EF4444" stroke="#1E293B" stroke-width="2" />
        <polygon points="-42.5,25 -28,57 -57,57" fill="#FFFFFF" />
        <rect x="10" y="10" width="65" height="65" rx="8" fill="#06B6D4" stroke="#1E293B" stroke-width="2" />
        <rect x="27.5" y="27.5" width="30" height="30" fill="#FFFFFF" transform="rotate(45 42.5 42.5)" />
      </g>
    </g>
  </g>
</svg>
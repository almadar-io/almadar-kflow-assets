<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="tiles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <g id="base-shape">
    <rect x="4" y="4" width="56" height="56" fill="url(#tiles)" stroke="#1E293B" stroke-width="2"/>
  </g>
  <g id="surface-details">
    <!-- packed 8x8 tile grid, no gaps -->
    <path d="M11 4 V60 M18 4 V60 M25 4 V60 M32 4 V60 M39 4 V60 M46 4 V60 M53 4 V60" stroke="#1B5E20" stroke-width="0.75"/>
    <path d="M4 11 H60 M4 18 H60 M4 25 H60 M4 32 H60 M4 39 H60 M4 46 H60 M4 53 H60" stroke="#1B5E20" stroke-width="0.75"/>
    <!-- pixel terrain tiles: ground rows, accent blocks -->
    <rect x="4" y="46" width="56" height="7" fill="#1B5E20" opacity="0.55"/>
    <rect x="4" y="53" width="56" height="7" fill="#1B5E20" opacity="0.75"/>
    <rect x="18" y="32" width="7" height="7" fill="#2E7D32"/>
    <rect x="39" y="32" width="7" height="7" fill="#2E7D32"/>
    <rect x="32" y="18" width="7" height="7" fill="#81C784" opacity="0.6"/>
    <rect x="4" y="4" width="7" height="7" fill="#81C784" opacity="0.6"/>
  </g>
  <g id="highlights">
    <line x1="5" y1="5" x2="59" y2="5" stroke="#81C784" stroke-width="1"/>
    <line x1="5" y1="45" x2="59" y2="45" stroke="#81C784" stroke-width="1" opacity="0.7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="ui-frame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="var(--color-asset-primary, #38BDF8)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #0284C7)" />
    </linearGradient>
    <linearGradient id="ui-inner-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- UI Frame Outer Plate -->
    <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#ui-frame-grad)" stroke="#1E293B" stroke-width="2" />
    <!-- Inner Dark Display Slot -->
    <rect x="7" y="7" width="50" height="50" rx="9" fill="url(#ui-inner-bg)" stroke="#0369A1" stroke-width="1.5" />
    <!-- Center Red/Blue Die Container -->
    <rect x="15" y="15" width="34" height="34" rx="7" fill="var(--color-asset-primary, #38BDF8)" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 15 41 Q 15 49 22 49 L 42 49 Q 49 49 49 41 L 49 38 L 15 38 Z" fill="var(--color-asset-secondary, #0284C7)" opacity="0.85" />
  </g>
  <g id="surface-details">
    <!-- UI Frame Corner Brackets -->
    <path d="M 4 14 L 4 6 L 14 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 60 14 L 60 6 L 50 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 4 50 L 4 58 L 14 58" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 60 50 L 60 58 L 50 58" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Die Pips (3-pip diagonal) -->
    <circle cx="23" cy="23" r="3.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.8" />
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.8" />
    <circle cx="41" cy="41" r="3.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="0.8" />
  </g>
  <g id="highlights">
    <!-- Outer Border Specular Curve -->
    <path d="M 12 4 A 8 8 0 0 1 52 4 A 10 10 0 0 0 12 4 Z" fill="#BAE6FD" opacity="0.8" />
    <!-- Die Top Specular -->
    <path d="M 19 17 L 45 17 Q 47 17 47 19 Q 44 19 40 19 L 21 19 Q 17 19 17 21 L 17 19 Q 17 17 19 17 Z" fill="#BAE6FD" opacity="0.9" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="card-front-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- Back Card in Fan (Left - Ace of Clubs) -->
    <rect x="6" y="10" width="34" height="48" rx="4" fill="url(#card-front-grad)" stroke="#1E293B" stroke-width="1.5" transform="rotate(-15 23 34)" />
    <!-- Back Card in Fan (Right - Ace of Hearts) -->
    <rect x="24" y="10" width="34" height="48" rx="4" fill="url(#card-front-grad)" stroke="#1E293B" stroke-width="1.5" transform="rotate(15 41 34)" />
    <!-- Center Main Card (Ace of Spades) -->
    <rect x="15" y="6" width="34" height="50" rx="4" fill="url(#card-front-grad)" stroke="#1E293B" stroke-width="2" />
  </g>
  <g id="surface-details">
    <!-- Green Accent Trim / Border -->
    <rect x="17" y="8" width="30" height="46" rx="2" fill="none" stroke="var(--color-asset-primary, #4CAF50)" stroke-width="1" opacity="0.6" />
    <!-- Ace Corner Label 'A' -->
    <text x="20" y="17" font-family="sans-serif" font-size="7" font-weight="bold" fill="var(--color-asset-secondary, #2E7D32)">A</text>
    <!-- Center Spade Symbol -->
    <path d="M 32 20 C 32 20 23 29 23 34 C 23 37.5 26 40 29.5 40 C 31.5 40 32.5 38.5 32.5 38.5 C 32.5 38.5 33.5 40 35.5 40 C 39 40 41 37.5 41 34 C 41 29 32 20 32 20 Z" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1" />
    <path d="M 30.5 38 L 33.5 38 L 34.5 44 L 29.5 44 Z" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1" />

    <!-- Left Card Spade Symbol -->
    <circle cx="16" cy="22" r="3" fill="#1E293B" transform="rotate(-15 23 34)" />

    <!-- Right Card Heart Symbol -->
    <path d="M 48 20 C 46 18 43 19 43 22 C 43 25 48 28 48 28 C 48 28 53 25 53 22 C 53 19 50 18 48 20 Z" fill="#EF4444" transform="rotate(15 41 34)" />
  </g>
  <g id="highlights">
    <!-- Gloss Reflection -->
    <path d="M 15 10 L 35 6 L 43 6 L 15 24 Z" fill="#81C784" opacity="0.3" />
    <circle cx="21" cy="11" r="1.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
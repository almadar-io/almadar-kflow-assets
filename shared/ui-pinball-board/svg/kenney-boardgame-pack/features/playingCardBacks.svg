<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="card-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="40%" stop-color="var(--color-asset-primary, #4CAF50)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)" />
    </linearGradient>
    <pattern id="lattice" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="none" stroke="#81C784" stroke-width="0.8" opacity="0.6" />
      <circle cx="4" cy="4" r="1" fill="#FFFFFF" opacity="0.8" />
    </pattern>
  </defs>
  <g id="base-shape">
    <!-- Underneath Card Shadow / Stack layer 2 -->
    <rect x="15" y="10" width="38" height="50" rx="4" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1.5" transform="rotate(6 34 35)" />
    <!-- Underneath Card Stack layer 1 -->
    <rect x="13" y="9" width="38" height="50" rx="4" fill="#1B5E20" stroke="#1E293B" stroke-width="1.5" transform="rotate(-4 32 34)" />
    <!-- Main Card Body -->
    <rect x="12" y="6" width="40" height="52" rx="4" fill="url(#card-back-grad)" stroke="#1E293B" stroke-width="2" />
  </g>
  <g id="surface-details">
    <!-- Outer White Border -->
    <rect x="15" y="9" width="34" height="46" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <!-- Inner Pattern Box -->
    <rect x="18" y="12" width="28" height="40" rx="1" fill="url(#lattice)" stroke="var(--color-asset-secondary, #2E7D32)" stroke-width="1.5" />
    <!-- Center Emblem -->
    <ellipse cx="32" cy="32" rx="8" ry="12" fill="var(--color-asset-secondary, #2E7D32)" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="32,24 35,30 40,32 35,34 32,40 29,34 24,32 29,30" fill="#81C784" stroke="#1E293B" stroke-width="0.75" />
  </g>
  <g id="highlights">
    <!-- Glossy diagonal streak -->
    <path d="M 12 12 L 32 6 L 40 6 L 12 28 Z" fill="#FFFFFF" opacity="0.25" />
    <!-- Top edge highlight -->
    <line x1="14" y1="8" x2="50" y2="8" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
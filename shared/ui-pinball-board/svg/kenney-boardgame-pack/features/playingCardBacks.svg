<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBackFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <pattern id="cardWeave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 4 L8 4 M4 0 L4 8" stroke="#1B5E20" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <g id="base-shape">
    <rect x="10" y="5" width="44" height="54" rx="5" fill="url(#cardBackFill)" stroke="#1E293B" stroke-width="2"/>
    <rect x="13" y="8" width="38" height="48" rx="3" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
  </g>
  <g id="surface-details">
    <rect x="15" y="10" width="34" height="44" rx="2" fill="url(#cardWeave)"/>
    <rect x="15" y="10" width="34" height="44" rx="2" fill="none" stroke="#1B5E20" stroke-width="1"/>
    <circle cx="32" cy="32" r="9" fill="#1B5E20"/>
    <circle cx="32" cy="32" r="6" fill="none" stroke="#81C784" stroke-width="1.4"/>
  </g>
  <g id="highlights">
    <path d="M14 9 L48 9" stroke="#81C784" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  </g>
</svg>

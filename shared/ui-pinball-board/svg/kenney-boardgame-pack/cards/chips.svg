<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="40%" stop-color="var(--color-asset-primary, #4CAF50)" />
      <stop offset="100%" stop-color="var(--color-asset-secondary, #2E7D32)" />
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- Drop shadow -->
    <ellipse cx="32" cy="54" rx="22" ry="5" fill="#1B5E20" opacity="0.35" />
    <!-- Secondary stacked chip underneath -->
    <ellipse cx="32" cy="36" rx="24" ry="24" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="1.5" />
    <!-- Primary top chip body -->
    <circle cx="32" cy="30" r="24" fill="url(#chip-grad)" stroke="#1E293B" stroke-width="2" />
  </g>
  <g id="surface-details">
    <!-- Outer edge notch stripes -->
    <rect x="30" y="7" width="4" height="6" fill="#FFFFFF" opacity="0.85" rx="1" />
    <rect x="30" y="47" width="4" height="6" fill="#FFFFFF" opacity="0.85" rx="1" />
    <rect x="9" y="28" width="6" height="4" fill="#FFFFFF" opacity="0.85" rx="1" />
    <rect x="49" y="28" width="6" height="4" fill="#FFFFFF" opacity="0.85" rx="1" />
    <rect x="15" y="13" width="5" height="4" fill="#FFFFFF" opacity="0.85" rx="1" transform="rotate(45 17.5 15)" />
    <rect x="44" y="42" width="5" height="4" fill="#FFFFFF" opacity="0.85" rx="1" transform="rotate(45 46.5 44)" />
    <rect x="44" y="13" width="5" height="4" fill="#FFFFFF" opacity="0.85" rx="1" transform="rotate(-45 46.5 15)" />
    <rect x="15" y="42" width="5" height="4" fill="#FFFFFF" opacity="0.85" rx="1" transform="rotate(-45 17.5 44)" />

    <!-- Inner ring -->
    <circle cx="32" cy="30" r="16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 3" />
    <circle cx="32" cy="30" r="11" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1B5E20" stroke-width="1.5" />
    <!-- Center star emblem -->
    <polygon points="32,22 34.5,27 40,27.5 36,31 37.5,36.5 32,33.5 26.5,36.5 28,31 24,27.5 29.5,27" fill="#81C784" />
  </g>
  <g id="highlights">
    <!-- Top crescent highlight -->
    <path d="M 12 26 A 22 22 0 0 1 52 26 A 24 24 0 0 0 12 26 Z" fill="#81C784" opacity="0.6" />
    <circle cx="20" cy="18" r="2.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
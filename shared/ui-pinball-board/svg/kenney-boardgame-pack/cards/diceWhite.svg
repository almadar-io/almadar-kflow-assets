<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="dice-white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>
  <g id="base-shape">
    <!-- Cast Shadow -->
    <rect x="10" y="52" width="44" height="8" rx="4" fill="#0369A1" opacity="0.3" />
    <!-- Die Body (White base with subtle bevel) -->
    <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#dice-white-grad)" stroke="#1E293B" stroke-width="2" />
    <!-- Bottom Bevel Shading in Blue Token Accent -->
    <path d="M 8 46 Q 8 56 18 56 L 46 56 Q 56 56 56 46 L 56 42 L 8 42 Z" fill="var(--color-asset-secondary, #0284C7)" opacity="0.3" opacity="0.85" />
  </g>
  <g id="surface-details">
    <!-- Inner face rim -->
    <rect x="12" y="12" width="40" height="40" rx="7" fill="none" stroke="var(--color-asset-primary, #38BDF8)" stroke-width="1.5" opacity="0.6" />
    <!-- Pips (6-dot configuration or 3-dot diagonal for contrast) -->
    <!-- Top-Left Pip -->
    <circle cx="21" cy="21" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
    <!-- Top-Right Pip -->
    <circle cx="43" cy="21" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
    <!-- Center-Left Pip -->
    <circle cx="21" cy="32" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
    <!-- Center-Right Pip -->
    <circle cx="43" cy="32" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
    <!-- Bottom-Left Pip -->
    <circle cx="21" cy="43" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
    <!-- Bottom-Right Pip -->
    <circle cx="43" cy="43" r="4.5" fill="var(--color-asset-secondary, #0284C7)" stroke="#1E293B" stroke-width="1" />
  </g>
  <g id="highlights">
    <!-- Glossy reflection top edge -->
    <path d="M 16 11 L 48 11 Q 53 11 53 16 L 53 18 Q 51 13 45 13 L 18 13 Q 13 13 13 18 L 13 45 Q 13 51 11 53 L 11 16 Q 11 11 16 11 Z" fill="#BAE6FD" opacity="0.9" />
    <circle cx="17" cy="17" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Group 1: Cube Top Face -->
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #4CAF50)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="12" y1="15" x2="38" y2="29" stroke="#2E7D32" stroke-width="1" opacity="0.6"/>
    <line x1="18" y1="12" x2="44" y2="26" stroke="#2E7D32" stroke-width="1" opacity="0.6"/>
    <line x1="24" y1="8" x2="50" y2="22" stroke="#2E7D32" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Group 2: Cube Left Face -->
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #2E7D32)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="6" y1="24" x2="32" y2="38" stroke="#1B5E20" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="31" x2="32" y2="45" stroke="#1B5E20" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="38" x2="32" y2="52" stroke="#1B5E20" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Group 3: Cube Right Face -->
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#1B5E20" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="32" y1="38" x2="58" y2="24" stroke="#0F380F" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="45" x2="58" y2="31" stroke="#0F380F" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="52" x2="58" y2="38" stroke="#0F380F" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Group 4: Face Highlights -->
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="6,18 32,32 58,18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
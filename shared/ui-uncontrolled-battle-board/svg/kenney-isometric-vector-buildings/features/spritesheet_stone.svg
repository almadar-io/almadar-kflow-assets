<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Group 1: Cube Top Face -->
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #94A3B8)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="32" y1="4" x2="32" y2="32" stroke="#334155" stroke-width="1.5"/>
    <line x1="19" y1="25" x2="45" y2="11" stroke="#334155" stroke-width="1.5"/>
    <line x1="19" y1="11" x2="45" y2="25" stroke="#334155" stroke-width="1.5"/>
    <polygon points="32,10 44,17 32,24 20,17" fill="#CBD5E1" opacity="0.25"/>
  </g>
  <!-- Group 2: Cube Left Face -->
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #64748B)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="6" y1="31" x2="32" y2="45" stroke="#334155" stroke-width="1.5"/>
    <line x1="19" y1="25" x2="19" y2="38" stroke="#334155" stroke-width="1.5"/>
    <line x1="12" y1="34" x2="12" y2="47" stroke="#334155" stroke-width="1.5"/>
    <line x1="25" y1="41" x2="25" y2="54" stroke="#334155" stroke-width="1.5"/>
  </g>
  <!-- Group 3: Cube Right Face -->
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#334155" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <line x1="32" y1="45" x2="58" y2="31" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="45" y1="25" x2="45" y2="38" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="38" y1="41" x2="38" y2="54" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="51" y1="34" x2="51" y2="47" stroke="#1E293B" stroke-width="1.5"/>
  </g>
  <!-- Group 4: Face Highlights -->
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="6,18 32,32 58,18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
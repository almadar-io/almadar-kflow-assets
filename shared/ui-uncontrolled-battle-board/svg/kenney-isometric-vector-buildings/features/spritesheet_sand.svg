<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Group 1: Cube Top Face -->
  <g id="cube-top-face">
    <polygon points="32,4 58,18 32,32 6,18" fill="var(--color-asset-primary, #FDE047)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14,14 Q32,10 50,14" stroke="#FEF08A" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M18,20 Q32,16 46,20" stroke="#EAB308" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  <!-- Group 2: Cube Left Face -->
  <g id="cube-left-face">
    <polygon points="6,18 32,32 32,58 6,44" fill="var(--color-asset-secondary, #EAB308)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M6,30 Q19,37 32,30" stroke="#CA8A04" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M6,40 Q19,47 32,40" stroke="#CA8A04" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  <!-- Group 3: Cube Right Face -->
  <g id="cube-right-face">
    <polygon points="32,32 58,18 58,44 32,58" fill="#CA8A04" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32,30 Q45,23 58,30" stroke="#A16207" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M32,40 Q45,33 58,40" stroke="#A16207" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>
  <!-- Group 4: Face Highlights -->
  <g id="face-highlights">
    <polyline points="6,18 32,4 58,18" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="6,18 32,32 58,18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>